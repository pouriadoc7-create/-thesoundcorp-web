# =============================================================================
# REFERENCE ONLY — the exact nginx site config from the ORIGINAL VPS, captured
# 2026-08-08 so nothing is lost. This VPS is multi-tenant: an nginx `stream`
# block in /etc/nginx/nginx.conf reads the TLS SNI and forwards HTTPS for this
# domain to 127.0.0.1:8443, where the second server block below terminates TLS
# with a (long-lived) origin certificate at /etc/ssl/thesoundcorp/origin.{crt,key}.
#
# For a NEW server you do NOT need this setup — use thesoundcorp.conf.template
# (standard Let's Encrypt). This file only documents how the original ran, in
# case you migrate to a similar Cloudflare-origin-cert / SNI-router host.
#
# The site was kept behind HTTP Basic Auth (user "admin"; the password lives in
# /etc/nginx/.htpasswd-thesoundcorp on the server — a secret, NOT stored in git).
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name thesoundcorp.ir www.thesoundcorp.ir;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-thesoundcorp;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name thesoundcorp.ir www.thesoundcorp.ir;

    ssl_certificate     /etc/ssl/thesoundcorp/origin.crt;
    ssl_certificate_key /etc/ssl/thesoundcorp/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-thesoundcorp;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
